{% extends "_base.html" %}
{% block title %}Contact - Demo Shop{% endblock %}
{% block content %}
  <h1>Contact Us</h1>
  {% if sent %}<p data-testid="contact-sent">Your message has been sent.</p>{% endif %}
  <form method="post">
    <label for="message">Message</label>
    <textarea id="message" name="message" data-testid="contact-message" required></textarea>
    <button type="submit" data-testid="contact-submit">Send Message</button>
  </form>
{% endblock %}
