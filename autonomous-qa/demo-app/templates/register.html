{% extends "_base.html" %}
{% block title %}Register - Demo Shop{% endblock %}
{% block content %}
  <h1>Create an account</h1>
  {% if message %}<p class="info">{{ message }}</p>{% endif %}
  <form method="post">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" data-testid="register-email" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" data-testid="register-password" required>
    <button type="submit" data-testid="register-submit">Create Account</button>
  </form>
{% endblock %}
